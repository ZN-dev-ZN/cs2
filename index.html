<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA Strategy Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1>EVA Strategy Tool</h1>
            <p class="subtitle">Créez des séquences tactiques pour EVA - After H</p>
        </header>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="tool-group">
                <button id="select-tool" class="tool-button active" title="Sélectionner">
                    <span class="icon">🖱️</span>
                </button>
                <button id="player-tool" class="tool-button" title="Ajouter un joueur">
                    <span class="icon">👤</span>
                </button>
                <button id="shield-tool" class="tool-button" title="Bouclier">
                    <span class="icon">🛡️</span>
                </button>
                <button id="smoke-tool" class="tool-button" title="Fumigène">
                    <span class="icon">💨</span>
                </button>
                <button id="flash-tool" class="tool-button" title="Flash">
                    <span class="icon">⚡</span>
                </button>
                <button id="he-tool" class="tool-button" title="Grenade">
                    <span class="icon">💣</span>
                </button>
                <button id="molotov-tool" class="tool-button" title="Feu">
                    <span class="icon">🔥</span>
                </button>
            </div>
            
            <div class="tool-group">
                <button id="clear-all" class="tool-button" title="Tout effacer">
                    <span class="icon">🗑️</span>
                </button>
                <button id="undo-btn" class="tool-button" title="Annuler">
                    <span class="icon">↩️</span>
                </button>
                <button id="redo-btn" class="tool-button" title="Rétablir">
                    <span class="icon">↪️</span>
                </button>
            </div>

            <div class="tool-group">
                <select id="map-select" class="map-select">
                    <option value="eva_arena">Arène EVA</option>
                    <option value="eva_forest">Forêt EVA</option>
                    <option value="eva_urban">Zone Urbaine</option>
                </select>
            </div>

            <div class="tool-group">
                <button id="save-strategy" class="tool-button" title="Sauvegarder">
                    <span class="icon">💾</span>
                </button>
                <button id="load-strategy" class="tool-button" title="Charger">
                    <span class="icon">📂</span>
                </button>
                <button id="export-gif" class="tool-button" title="Exporter GIF">
                    <span class="icon">🎬</span>
                </button>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-container">
            <div id="map-canvas" class="map-canvas">
                <!-- Map image will be loaded here -->
                <img id="map-image" src="maps/eva_arena.png" alt="Carte EVA" class="map-image">
                
                <!-- Strategy elements will be added here -->
                <div id="strategy-elements" class="strategy-elements"></div>
                
                <!-- Sequence paths -->
                <canvas id="sequence-canvas" class="sequence-canvas"></canvas>
            </div>

            <!-- Sequences Panel -->
            <div class="sequences-container">
                <div class="sequences-header">
                    <h3>Séquences</h3>
                    <div class="sequence-controls">
                        <button id="add-sequence" class="btn-small">+ Ajouter</button>
                        <button id="play-sequences" class="btn-small btn-primary">▶ Lecture</button>
                        <button id="stop-sequences" class="btn-small">⏹ Arrêt</button>
                    </div>
                </div>
                <div id="sequences-list" class="sequences-list"></div>
            </div>
        </div>

        <!-- Side Panel -->
        <aside class="side-panel">
            <div class="panel-section">
                <h3>Propriétés</h3>
                <div id="properties-panel" class="properties-panel">
                    <p class="no-selection">Aucun élément sélectionné</p>
                </div>
            </div>

            <div class="panel-section">
                <h3>Équipes</h3>
                <div class="team-selector">
                    <div class="team-option">
                        <label>
                            <input type="radio" name="team" value="alpha" checked>
                            <span class="team-color alpha-color"></span>
                            <span>Alpha (4/4)</span>
                        </label>
                        <div id="alpha-players" class="player-slots">
                            <span class="player-slot">1</span>
                            <span class="player-slot">2</span>
                            <span class="player-slot">3</span>
                            <span class="player-slot">4</span>
                        </div>
                    </div>
                    <div class="team-option">
                        <label>
                            <input type="radio" name="team" value="bravo">
                            <span class="team-color bravo-color"></span>
                            <span>Bravo (4/4)</span>
                        </label>
                        <div id="bravo-players" class="player-slots">
                            <span class="player-slot">1</span>
                            <span class="player-slot">2</span>
                            <span class="player-slot">3</span>
                            <span class="player-slot">4</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel-section">
                <h3>Équipement</h3>
                <div class="equipment-selector">
                    <div class="equip-option">
                        <label>
                            <input type="checkbox" id="has-shield" checked>
                            <span class="icon">🛡️</span>
                            <span>Bouclier</span>
                        </label>
                    </div>
                    <div class="equip-option">
                        <label>
                            <input type="checkbox" id="has-smoke">
                            <span class="icon">💨</span>
                            <span>Fumigène</span>
                        </label>
                    </div>
                    <div class="equip-option">
                        <label>
                            <input type="checkbox" id="has-flash">
                            <span class="icon">⚡</span>
                            <span>Flash</span>
                        </label>
                    </div>
                    <div class="equip-option">
                        <label>
                            <input type="checkbox" id="has-he">
                            <span class="icon">💣</span>
                            <span>Grenade</span>
                        </label>
                    </div>
                    <div class="equip-option">
                        <label>
                            <input type="checkbox" id="has-molotov">
                            <span class="icon">🔥</span>
                            <span>Feu</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="panel-section">
                <h3>Notes</h3>
                <textarea id="strategy-notes" placeholder="Ajoutez des notes pour cette séquence..."></textarea>
            </div>
        </aside>

        <!-- Strategy List -->
        <div class="strategy-list-container">
            <h3>Mes Stratégies</h3>
            <div id="strategy-list" class="strategy-list">
                <div class="strategy-item new-strategy">
                    <span class="icon">+</span>
                    <span>Nouvelle Stratégie</span>
                </div>
            </div>
        </div>

        <!-- Sequence Modal -->
        <div id="sequence-modal" class="modal">
            <div class="modal-content">
                <h2>Nouvelle Séquence</h2>
                <form id="sequence-form">
                    <div class="form-group">
                        <label for="sequence-name">Nom de la séquence</label>
                        <input type="text" id="sequence-name" placeholder="Ex: Attaque par la gauche" required>
                    </div>
                    <div class="form-group">
                        <label for="sequence-duration">Durée (secondes)</label>
                        <input type="number" id="sequence-duration" value="5" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="sequence-description">Description</label>
                        <textarea id="sequence-description" placeholder="Description de la séquence..."></textarea>
                    </div>
                    <div class="modal-buttons">
                        <button type="button" id="cancel-sequence" class="btn-secondary">Annuler</button>
                        <button type="submit" class="btn-primary">Créer</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Save Modal -->
        <div id="save-modal" class="modal">
            <div class="modal-content">
                <h2>Sauvegarder la Stratégie</h2>
                <form id="save-form">
                    <div class="form-group">
                        <label for="strategy-name">Nom de la stratégie</label>
                        <input type="text" id="strategy-name" placeholder="Ex: Stratégie Forêt - Rush B" required>
                    </div>
                    <div class="modal-buttons">
                        <button type="button" id="cancel-save" class="btn-secondary">Annuler</button>
                        <button type="submit" class="btn-primary">Sauvegarder</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Toast notifications -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
